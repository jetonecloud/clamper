# Indicative per-hour prices, for ordering `clamper plan`.
#
# READ THIS BEFORE QUOTING A FIGURE FROM IT
# -----------------------------------------
# This table exists so that `clamper plan` can put the expensive thing at the
# top of the page. The person reading that page during a cost incident has
# thirty seconds and acts on the first line, so getting the *order* right is
# most of the value and getting the third decimal place right is almost none.
#
# These are us-east-1 on-demand list prices. They are a static table, not a
# live lookup: `pricing:GetProducts` would be a per-request charge, and the
# design's whole claim is that Clamper is not a cost of its own.
#
# What that means in practice:
#
#   * Every figure Clamper prints from this file is rendered with a `~` and
#     carries the `basis` sentence below.
#   * Prices change, and this file is a snapshot. Treat a figure as an
#     order of magnitude, not as a bill.
#   * An instance type that is not listed here gets NO figure. `clamper plan`
#     says "price unknown" rather than guessing from the family name. A wrong
#     number in a report to a manager costs more credibility than the number
#     was worth — the same rule Preflight and Crosswind follow.
#   * Savings Plans, Reserved Instances, other regions, EBS, snapshots,
#     licensing and data transfer are not modelled at all.
#   * No figure here is ever used to decide whether to clamp. The decision
#     comes from the budget. This only changes the order of a list.
#
# Adding a type is a one-line change and a good first contribution. Please
# take the figure from the AWS pricing page for us-east-1 on-demand Linux and
# say in the PR where you read it.

version: 1

basis: >-
  us-east-1 on-demand list price, Linux, single-AZ, excluding storage,
  Savings Plans and Reserved Instances

note: >-
  Indicative figures for ranking targets, from a static table. Not a billing
  estimate. An unlisted instance type shows no figure rather than a guess.

families:
  # --- EC2 ------------------------------------------------------------
  #
  # The burstable and general-purpose families most accounts run, plus the
  # GPU families that are the reason this tool exists: a forgotten
  # p4d.24xlarge is $23,000 a month.
  ec2:
    t3.micro: 0.0104
    t3.small: 0.0208
    t3.medium: 0.0416
    t3.large: 0.0832
    t3.xlarge: 0.1664
    t3.2xlarge: 0.3328

    m5.large: 0.096
