  # --- RDS ------------------------------------------------------------
  #
  # Single-AZ PostgreSQL. `rds_price` applies a 2x multiplier for Multi-AZ,
  # which is exact for the instance-hour component — the only component a
  # stop saves. SQL Server and Oracle carry licence costs on top, so their
  # real figure is higher than this one and never lower.
  rds:
    db.t3.micro: 0.018
    db.t3.small: 0.036
    db.t3.medium: 0.072
    db.t3.large: 0.145
    db.t3.xlarge: 0.29
    db.t3.2xlarge: 0.58

    db.t4g.micro: 0.016
