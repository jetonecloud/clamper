    db.r5.xlarge: 0.48
    db.r5.2xlarge: 0.96
    db.r5.4xlarge: 1.92
    db.r5.8xlarge: 3.84
    db.r5.12xlarge: 5.76

  # --- SageMaker notebook instances -----------------------------------
