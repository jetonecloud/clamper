[project]
name = "clamper"
version = "0.1.0"
description = "Hard spending limits for AWS. When a budget is breached, Clamper stops what's costing you money and tells you exactly what it stopped."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Jet1", email = "hello@jetonecloud.com" }]
keywords = ["aws", "budget", "cost-control", "finops", "devops", "lambda"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  # Imported directly for prompt/abort handling, and we rely on the separated
  # stdout/stderr streams in CliRunner that 8.2 introduced.
  "click>=8.2",
  "boto3>=1.34",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jetonecloud/clamper"
Issues = "https://github.com/jetonecloud/clamper/issues"
Releases = "https://github.com/jetonecloud/clamper/releases"
Security = "https://github.com/jetonecloud/clamper/blob/main/SECURITY.md"
Changelog = "https://github.com/jetonecloud/clamper/blob/main/CHANGELOG.md"

[project.scripts]
clamper = "clamper.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Whole-flow tests need a DynamoDB that behaves like one. Stubber validates
  # requests but has no state, so the ledger round-trips run on moto.
  "moto[dynamodb,ec2,autoscaling,ecs,rds,awslambda,sagemaker,sns,sts]>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clamper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/clamper"]
strict = true
warn_unreachable = true

# boto3/botocore ship no usable type information and the typed stubs are a
# large dependency. Every client is created in core/session.py and every
# mutating call goes through core/actuator.py, so the untyped surface is two
# modules rather than the whole package.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["clamper"]
